<!DOCTYPE html>
<html lang="en">

<head>

</head>


<body>
    <form>
        <h1>History</h1>
        <label for="physicianName">Name of Current Physician</label>
        <input type="text" id="physicianName" />

        <label for="phone">Primary Number</label>
        <input type="tel" id="phone" placeholder="(000)000-0000" />

        <label for="lastvisit">Date of Last Visit</label>
        <input type="date" id="lastvisit" />

        </br>
        <hr />
        </br>

        <h2>Have you Had:</h2>
        <label for="add/adhd">ADD/ADHD</label>
        <fieldset>
            <label for="yes">Yes</label>
            <input id="yes" type="radio" name="yes" value="yes" />

            <label for="no">No</label>
            <input id="no" type="radio" name="no" value="no" />
        </fieldset>

        <label for="radiationTreatment">Radiation Treatment</label>
        <fieldset>
            <label for="yes">Yes</label>
            <input id="yes" type="radio" name="yes" value="yes" />

            <label for="no">No</label>
            <input id="no" type="radio" name="no" value="no" />
        </fieldset>

    </form>
</body>

</html>
