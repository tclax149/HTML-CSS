<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>
    <form>
        <h1>Let's build something great together</h1>

        <img src="/Images/headshot.png" alt="headshot" width="100" height="100" />
        <img src="/Images/avatar.jpg" alt="avatar" width="100" height="100" />

        <p>(you will hear back from me within 24hours )</p>
        <h2>Help me get to know you!</h2>


        <label for="firstName">First name</label>
        <input type="text" id="firstName" required />

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required />

        <label for="email">Email:</label>
        <input type="email" id="email" required />

        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" id="phoneNumber" />

        <label for="worktype">Type of work</label>
        <select id="worktype" name="worktype">
            <option value="" disabled selected>Choose one</option>
            <option value="option1">Remote work</option>
            <option value="option2">Full time</option>
            <option value="option3">Part time</option>
        </select>

        <fieldset>
            <legend>What budget range are you in</legend>
            <label for="budget1">$1,000-$5,000</label>
            <input id="budget1" type="radio" name="budget" value="budget1" />

            <label for="budget2">$5,000-$10,000</label>
            <input id="budget2" type="radio" name="budget" value="budget2" />

            <label for="budget3">$10,000-$20,000</label>
            <input id="budget3" type="radio" name="budget" value="budget2" />

            <label for="budget4">$20,000 - $50,000+</label>
            <input id="budget3" type="radio" name="budget" value="budget2" />
        </fieldset>

        <h2>Tell me more about the project</h2>

        <label for="timeline">Timeline</label>
        <select id="timeline" name="timeline">
            <option value="" disabled selected>Project Timeline</option>
            <option value="option1">ASAP</option>
            <option value="option2">1 month</option>
            <option value="option3">2 months</option>
            <option value="option4">3 months</option>
            <option value="option5">6 months</option>
            <option value="option6">1 Year</option>
        </select>

        <input type="text" placeholder="Hello, i'm looking for a creative specialist to help me with..." />

        <label>How did you hear about me</label>
        <select id="worktype" name="worktype">
            <option value="" disabled selected>Choose One</option>
            <option value="option1">Social Media</option>
            <option value="option2">Job Board</option>
            <option value="option3">Word of Mouth</option>
            <option value="option4">Other</option>
        </select>

        </br>
        <button>Submit</button>
    </form>

</body>

</html>
