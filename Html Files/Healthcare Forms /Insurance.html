<!DOCTYPE html>
<html lang="en">

<body>
    <form>
        <h1>Insurance</h1>
        <label for="firstname">Patient First Name</label>
        <input type="text" id="firstname" placeholder="First name" required />

        <label for="middlename">Patient Midddle Name</label>
        <input type="text" id="middlename" placeholder="Middle name" />

        <label for="lastname">Patient Last Name</label>
        <input type="text" id="lastname" placeholder="Last name" />

        <label for="preferredname">Patient Preferred Name</label>
        <input type="text" id="preferredname" placeholder="Preferred name" />

        <hr />
        </br>

        <label for="insurance">Primary Insurance Policy Holder</label>
        <select id="insurance" name="insurance">
            <option value="" disabled selected>Choose one</option>
            <option value="option1">Self</option>
            <option value="option2">Spouse</option>
            <option value="option3">Father</option>
            <option value="option4">Mother</option>
            <option value="option5">Family</option>
            <option value="option6">other</option>
        </select>

        <label for="firstnamePrimary">First Name of Primary Insured</label>
        <input type="text" id="firstname" placeholder="First name" required />

        <label for="lastnamePrimary">Last Name of Primary Insured</label>
        <input type="text" id="firstname" placeholder="Last name" required />
        <hr />

        <label for="insuranceIDnum">Insurance ID #</label>
        <input id="insuranceIDnum" type="type" placeholder="Insurance ID #" />

        <label for="insuranceName">Insurance Company Name</label>
        <input id="insuranceName" type="type" placeholder="Insurance Name" />

        <label for="groupName">Group Name</label>
        <input id="groupName" type="type" placeholder="Group Name" />
        <hr />

        <label for="groupNumber">Group Number</label>
        <input id="groupNumber" type="type" placeholder="Group Number" />

        <label for="primaryDOB">Birthdate of Primary Insured</label>
        <input id="primaryDOB" type="date" />

        <label for="relationship">Primary Insured Relationship to Patient</label>
        <input id="relationship" type="type" placeholder="Relationship" />
        <hr />

        <label>Upload Insurance</label>
        <input type="file" />
        <input type="file" />


        <h3>Do you have Secondary Insurance</h3>
        <button>Yes</button>
        <button>No</button>

    </form>

</body>

</html>
